# 毎月1日にアクセストークンを延長し、Secrets を新しいトークンで上書きする
# （長期トークンは60日で切れるため。更新しないと約2か月で表示が止まる）
name: Instagram token refresh

on:
  schedule:
    - cron: "0 0 1 * *"    # 毎月1日 9:00（JST）
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh token and save to Secrets
        env:
          OLD_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          RES=$(curl -sS "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${OLD_TOKEN}")
          NEW=$(echo "$RES" | jq -r '.access_token // empty')
          if [ -z "$NEW" ]; then
            echo "トークン更新に失敗しました: $(echo "$RES" | jq -c '.error // .')"
            exit 1
          fi
          echo "::add-mask::$NEW"
          DAYS=$(( $(echo "$RES" | jq -r '.expires_in') / 86400 ))
          gh secret set IG_ACCESS_TOKEN --repo "$REPO" --body "$NEW"
          echo "✓ トークンを更新しました（残り約 ${DAYS} 日）"
